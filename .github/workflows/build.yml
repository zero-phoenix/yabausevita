name: Build YabauseVita (Milestone 0)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang 21
        run: curl https://apt.llvm.org/llvm.sh | sudo bash -s -- 21

      - name: Checkout vitasdk installer
        uses: actions/checkout@v4
        with:
          repository: vitasdk/vdpm
          path: vdpm

      - name: Install vitasdk (full toolchain)
        run: |
          cd vdpm
          ./bootstrap-vitasdk.sh
          ./install-all.sh
        env:
          VITASDK: /usr/local/vitasdk

      - name: Create Build Directory
        run: mkdir build
        
      - name: Configure CMake
        working-directory: build
        env:
          VITASDK: /usr/local/vitasdk
        # Aquí le decimos a CMake que use el compilador de Vita y que compile el puerto de Vita
        run: cmake -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/toolchain.cmake -DYAB_PORTS=vita -DCMAKE_BUILD_TYPE=Release ..
        
      - name: Build
        working-directory: build
        env:
          VITASDK: /usr/local/vitasdk
        # Compilamos directamente el target del VPK
        run: make yabause_vita.vpk

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: YabauseVita-milestone0-vpk
          path: build/YabauseVita.vpk

      - name: Upload build log always (even on failure, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-directory
          path: build/
