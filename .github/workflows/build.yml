name: Build Yabause Vita

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITASDK: /usr/local/vitasdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM 21
        run: curl https://apt.llvm.org/llvm.sh | sudo bash -s -- 21

      - name: Checkout vdpm
        uses: actions/checkout@v4
        with:
          repository: vitasdk/vdpm
          path: vdpm

      - name: Install VitaSDK
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH="$VITASDK/bin:$PATH"
          cd vdpm
          ./bootstrap-vitasdk.sh
          ./install-all.sh

      - name: Configure and Build
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH="$VITASDK/bin:$PATH"
          mkdir -p build
          cd build
          # Pasamos -DVITASDK explícitamente para que CMakeLists.txt lo encuentre
          cmake -DVITASDK="$VITASDK" -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.cmake" -DYAB_PORTS=vita -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Add BIOS and ROMs folders to VPK
        run: |
          cd build
          # Crear las carpetas y un archivo temporal para que no estén vac
