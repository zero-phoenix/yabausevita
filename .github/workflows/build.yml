name: Build YabauseVita

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITASDK: /usr/local/vitasdk

    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: |
          curl https://apt.llvm.org/llvm.sh | sudo bash -s -- 18
          sudo apt-get update && sudo apt-get install -y clang-18 lld-18

      - name: Checkout vdpm
        uses: actions/checkout@v4
        with:
          repository: vitasdk/vdpm
          path: vdpm

      - name: Install VitaSDK + vita2d
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH="$VITASDK/bin:$PATH"
          cd vdpm
          ./bootstrap-vitasdk.sh
          ./install-all.sh

      - name: Verify vita2d
        run: |
          ls -la /usr/local/vitasdk/arm-vita-eabi/lib/libvita2d.a
          test -f /usr/local/vitasdk/arm-vita-eabi/include/vita2d.h && echo "OK: vita2d.h present"

      - name: Configure (CMake)
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH="/usr/local/vitasdk/bin:$PATH"
          rm -rf build
          mkdir build
          cd build
          cmake -DVITASDK="/usr/local/vitasdk" \
                -DCMAKE_TOOLCHAIN_FILE="/usr/local/vitasdk/share/vita.toolchain.cmake" \
                -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH="/usr/local/vitasdk/bin:$PATH"
          set -o pipefail
          cmake --build build -- -j$(nproc) 2>&1 | tee build/build_log.txt

      - name: Push build log to webhook on failure
        if: failure()
        run: |
          curl -X POST -H "Content-Type: text/plain" --data-binary @build/build_log.txt https://webhook.site/9c2776d0-dca8-472a-abea-2df0b68ef712
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify VPK
        run: |
          test -f build/YabauseVita.vpk && echo "OK: VPK exists"
          unzip -l build/YabauseVita.vpk

      - name: Create Zip Archive
        run: |
          cd build
          zip YabauseVita-Release.zip YabauseVita.vpk

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YabauseVita-vpk
          path: build/YabauseVita.vpk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          files: build/YabauseVita-Release.zip
          tag_name: build-${{ github.sha }}
          name: Auto-Build ${{ github.sha }}
          body: "YabauseVita - Optimización Extrema del Motor JIT ARM (Traducción Nativa de Saltos BRA y BSR)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build directory (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-directory
          path: build/