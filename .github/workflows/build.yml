name: Build YabauseVita (Milestone 0)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang 21
        run: curl https://apt.llvm.org/llvm.sh | sudo bash -s -- 21

      - name: Checkout vitasdk installer
        uses: actions/checkout@v4
        with:
          repository: vitasdk/vdpm
          path: vdpm

      - name: Install vitasdk (full toolchain)
        run: |
          cd vdpm
          ./bootstrap-vitasdk.sh
          ./install-all.sh
        env:
          VITASDK: /usr/local/vitasdk

      - name: DIAGNOSTIC - verify psp2 headers actually exist
        run: |
          echo "=== Does VITASDK dir exist? ==="
          ls -la /usr/local/vitasdk/ || echo "MISSING: /usr/local/vitasdk"
          echo "=== Does arm-vita-eabi/include exist? ==="
          ls -la /usr/local/vitasdk/arm-vita-eabi/include/ | head -20 || echo "MISSING include dir"
          echo "=== Does psp2/ subfolder exist? ==="
          ls -la /usr/local/vitasdk/arm-vita-eabi/include/psp2/ | head -20 || echo "MISSING psp2 dir"
          echo "=== Does psp2/kernel/ subfolder exist? ==="
          ls -la /usr/local/vitasdk/arm-vita-eabi/include/psp2/kernel/ | head -20 || echo "MISSING psp2/kernel dir"
          echo "=== Searching the WHOLE filesystem for processmgr.h ==="
          find / -name "processmgr.h" 2>/dev/null || echo "NOT FOUND ANYWHERE ON DISK"
          echo "=== What compiler are we actually using, and its default search paths ==="
          /usr/local/vitasdk/bin/arm-vita-eabi-gcc -print-sysroot || echo "gcc -print-sysroot failed"
          echo | /usr/local/vitasdk/bin/arm-vita-eabi-gcc -E -Wp,-v - 2>&1 | grep -A20 "search starts here"

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
        env:
          VITASDK: /usr/local/vitasdk

      - name: Build
        run: cmake --build build --verbose
        env:
          VITASDK: /usr/local/vitasdk

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: YabauseVita-milestone0-vpk
          path: build/YabauseVita.vpk

      - name: Upload build log always (even on failure, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-directory
          path: build/
