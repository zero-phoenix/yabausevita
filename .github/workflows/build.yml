name: Build Yabause Vita

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      VITASDK: /usr/local/vitasdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM 21
        run: curl https://apt.llvm.org/llvm.sh | sudo bash -s -- 21

      - name: Checkout VitaSDK package manager
        uses: actions/checkout@v4
        with:
          repository: vitasdk/vdpm
          path: vdpm

      - name: Install VitaSDK
        run: |
          cd vdpm
          ./bootstrap-vitasdk.sh
          ./install-all.sh

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.cmake -DYAB_PORTS=vita -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Upload VPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YabauseVita-vpk
          path: build/*.vpk
          if-no-files-found: warn
